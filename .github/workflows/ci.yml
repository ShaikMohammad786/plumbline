name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  test:
    name: Test (${{ matrix.os }} - Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Type check with mypy
        run: |
          mypy src tests

      - name: Run pytest with coverage
        run: |
          pytest -q --cov=src/plumbline --cov-fail-under=80 tests/

      - name: Plumbline self-scan and SARIF export
        run: |
          plumb version
          plumb scan . --format terminal --format sarif --out .plumbline/out --fail-on high

      - name: Upload SARIF report
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .plumbline/out/report.sarif
