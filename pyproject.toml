[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plumbline"
version = "0.1.0"
description = "Repository truth scanner and agent gate for security, slop, gaps, and claim verification"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "skmohammad" }
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "pathspec>=0.12.0",
    "httpx>=0.27.0",
    "tree-sitter>=0.22.0",
    "tree-sitter-language-pack>=0.2.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
plumb = "plumbline.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/plumbline"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/golden"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ["^tests/golden/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
